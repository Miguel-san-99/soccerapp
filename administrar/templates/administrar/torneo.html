{% extends 'administrar/base.html' %}

{% block content %}
<div class="container">
    <div class="row py-4 mb-5">

        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'competencia' %}">Competencia</a></li>
                <li class="breadcrumb-item active" aria-current="page">
                    Torneo
                </li>
            </ol>
        </nav>

    </div>
    <div class="row d-flex justify-content-center align-items-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <h2 class="mb-3">Selecciona un torneo de la competencia <strong>{{competencia.nombre}}</strong></h2>

            <p class="text-muted mb-4">
                Debes seleccionar el torneo para continuar.
            </p>

            <div class="list-group">

                {% for torneo in torneos %}

                <a href="{% url 'administrar_torneo' competencia.id torneo.id %}" class="list-group-item list-group-item-action">
                    {{ torneo.nombre }}
                </a>

                {% endfor %}

            </div>

        </div>
    </div>
</div>
{% endblock %}
